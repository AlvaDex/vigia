id: VIG-0001
title: SSH brute force from single IP
description: Multiple failed SSH password attempts from the same source IP in a short time window.
severity: high
mitre:
  tactic: Credential Access
  technique: T1110.001
  technique_name: "Brute Force: Password Guessing"
logsource: ssh
detection:
  message_contains: "Failed password"
  group_by: source_ip
  threshold: 5
  timeframe_seconds: 60